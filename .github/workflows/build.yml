name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Toolchain info
        run: |
          sw_vers
          swift --version

      - name: Build LiveWall.app
        run: ./scripts/build.sh

      - name: Package
        run: |
          cd build
          ditto -c -k --keepParent LiveWall.app LiveWall-macOS.zip

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: LiveWall-macOS
          path: build/LiveWall-macOS.zip
