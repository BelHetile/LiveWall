name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain info
        run: |
          sw_vers
          swift --version

      - name: Build LiveWall.app
        run: ./build.sh

      - name: Package
        run: |
          cd build
          ditto -c -k --keepParent LiveWall.app LiveWall-macOS.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiveWall-macOS
          path: build/LiveWall-macOS.zip
