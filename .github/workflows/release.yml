name: Release

# Publish a release either by pushing a tag like v1.0.0, or from the Actions tab:
# Release → Run workflow → enter a version (e.g. 1.0.0); the tag is created for you.
# Running it by hand without a version only builds and uploads the files as an artifact.
# Running it by hand for a version that already exists moves its tag to the current commit and replaces its files.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, e.g. 1.0.0 (empty = test build only)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            V="${{ inputs.version }}"
            V="${V#v}"
          else
            V="0.0.0-dev"
          fi
          echo "value=$V" >> "$GITHUB_OUTPUT"
          echo "Version: $V"

      - name: Build universal app
        env:
          LIVEWALL_VERSION: ${{ steps.version.outputs.value }}
        run: ./scripts/build.sh --universal

      - name: Check the binary
        run: |
          BIN=build/LiveWall.app/Contents/MacOS/LiveWall
          ARCHS="$(lipo -archs "$BIN")"
          echo "Architectures: $ARCHS"
          [[ "$ARCHS" == *arm64* && "$ARCHS" == *x86_64* ]] || { echo "Not a universal binary"; exit 1; }
          codesign --verify --deep --strict build/LiveWall.app
          plutil -lint build/LiveWall.app/Contents/Info.plist

      - name: Package
        run: |
          cd build
          ditto -c -k --keepParent LiveWall.app LiveWall-macOS.zip
          mkdir dmg
          cp -R LiveWall.app dmg/
          ln -s /Applications dmg/Applications
          cp ../scripts/dmg-install.command "dmg/Install LiveWall.command"
          chmod +x "dmg/Install LiveWall.command"
          hdiutil create -volname LiveWall -srcfolder dmg -ov -format UDZO LiveWall.dmg
          shasum -a 256 LiveWall-macOS.zip LiveWall.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Release notes
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[?" v "\\]?" { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > build/notes.md
          if [[ ! -s build/notes.md ]]; then echo "See CHANGELOG.md" > build/notes.md; fi
          {
            echo
            echo "### Install"
            echo
            echo '```bash'
            echo 'curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/install.sh | bash'
            echo '```'
            echo
            echo "Or download **LiveWall.dmg**, open it and double-click **Install LiveWall.command** (or drag LiveWall to Applications; see the README for the first-launch steps)."
          } >> build/notes.md
          cat build/notes.md

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.version.outputs.value }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # run again by hand for an existing version: move the tag to this commit and replace the files
            if [[ "$GITHUB_REF" != refs/tags/* ]]; then
              git tag -f "$TAG" "$GITHUB_SHA"
              git push -f origin "refs/tags/$TAG"
            fi
            gh release upload "$TAG" build/LiveWall-macOS.zip build/LiveWall.dmg build/SHA256SUMS.txt --clobber
            gh release edit "$TAG" --title "LiveWall ${{ steps.version.outputs.value }}" --notes-file build/notes.md
          else
            gh release create "$TAG" \
              build/LiveWall-macOS.zip build/LiveWall.dmg build/SHA256SUMS.txt \
              --target "$GITHUB_SHA" \
              --title "LiveWall ${{ steps.version.outputs.value }}" \
              --notes-file build/notes.md
          fi

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: LiveWall-${{ steps.version.outputs.value }}
          path: |
            build/LiveWall-macOS.zip
            build/LiveWall.dmg
            build/SHA256SUMS.txt
