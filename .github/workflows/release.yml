name: Release

# Publish a release either by pushing a tag like v1.0.0, or from the Actions tab:
# Release → Run workflow → enter a version (e.g. 1.0.0); the tag is created for you.
# Running it by hand without a version only builds and uploads the files as an artifact.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, e.g. 1.0.0 (empty = test build only)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          elif [[ -n "$INPUT_VERSION" ]]; then
            V="$INPUT_VERSION"
            V="${V#v}"
          else
            V="0.0.0-dev"
          fi
          echo "value=$V" >> "$GITHUB_OUTPUT"
          echo "Version: $V"

      - name: Build universal app
        env:
          LIVEWALL_VERSION: ${{ steps.version.outputs.value }}
        run: ./scripts/build.sh --universal

      - name: Check the binary
        run: |
          BIN=build/LiveWall.app/Contents/MacOS/LiveWall
          ARCHS="$(lipo -archs "$BIN")"
          echo "Architectures: $ARCHS"
          [[ "$ARCHS" == *arm64* && "$ARCHS" == *x86_64* ]] || { echo "Not a universal binary"; exit 1; }
          codesign --verify --deep --strict build/LiveWall.app
          plutil -lint build/LiveWall.app/Contents/Info.plist

      - name: Package
        run: |
          cd build
          ditto -c -k --keepParent LiveWall.app LiveWall-macOS.zip
          mkdir dmg
          cp -R LiveWall.app dmg/
          ln -s /Applications dmg/Applications
          cp ../scripts/dmg-install.command "dmg/Install LiveWall.command"
          chmod +x "dmg/Install LiveWall.command"
          hdiutil create -volname LiveWall -srcfolder dmg -ov -format UDZO LiveWall.dmg
          shasum -a 256 LiveWall-macOS.zip LiveWall.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Release notes
        env:
          VERSION: ${{ steps.version.outputs.value }}
          REPO: ${{ github.repository }}
        run: |
          awk -v v="$VERSION" '
            BEGIN { gsub(/\./, "[.]", v) }
            $0 ~ "^## \\[?" v "\\]?" { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > build/notes.md
          if [[ ! -s build/notes.md ]]; then echo "See CHANGELOG.md" > build/notes.md; fi
          {
            echo
            echo "### Install"
            echo
            echo '```bash'
            echo "curl -fsSL https://raw.githubusercontent.com/$REPO/main/scripts/install.sh | bash"
            echo '```'
            echo
            echo "Or download **LiveWall.dmg**, open it and double-click **Install LiveWall.command** (or drag LiveWall to Applications; see the README for the first-launch steps)."
          } >> build/notes.md
          cat build/notes.md

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            TAG_SHA="$(git ls-remote --tags origin | awk -v t="refs/tags/$TAG" '$2==t"^{}"{p=$1} $2==t{s=$1} END{if(p)print p; else print s}')"
            if [[ -n "$TAG_SHA" && "$TAG_SHA" != "$GITHUB_SHA" ]]; then
              echo "Tag $TAG already points at $TAG_SHA, not $GITHUB_SHA; refusing to move an existing published tag." >&2
              exit 1
            fi
            gh release upload "$TAG" build/LiveWall-macOS.zip build/LiveWall.dmg build/SHA256SUMS.txt --clobber
            gh release edit "$TAG" --title "LiveWall $VERSION" --notes-file build/notes.md
          else
            gh release create "$TAG" \
              build/LiveWall-macOS.zip build/LiveWall.dmg build/SHA256SUMS.txt \
              --target "$GITHUB_SHA" \
              --title "LiveWall $VERSION" \
              --notes-file build/notes.md
          fi

      - name: Upload build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: LiveWall-${{ steps.version.outputs.value }}
          path: |
            build/LiveWall-macOS.zip
            build/LiveWall.dmg
            build/SHA256SUMS.txt
