[package]
name = "livewall"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LiveWall menu-bar wallpaper engine"

[lib]
name = "livewall"
path = "src/lib.rs"

[[bin]]
name = "LiveWall"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tempfile.workspace = true
uuid.workspace = true
jiff.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-oslog.workspace = true
objc2.workspace = true
objc2-foundation = { workspace = true, features = ["std", "NSObject", "NSNotification", "NSString"] }
objc2-app-kit = { workspace = true, features = ["std", "NSApplication", "NSResponder", "NSRunningApplication"] }
block2.workspace = true
dispatch2.workspace = true
proto.workspace = true
