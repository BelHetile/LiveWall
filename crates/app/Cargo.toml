[package]
name = "livewall"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LiveWall menu-bar wallpaper engine"

[lib]
name = "livewall"
path = "src/lib.rs"

[[bin]]
name = "LiveWall"
path = "src/main.rs"

[[bin]]
name = "lwui"
path = "src/bin/lwui.rs"

[[test]]
name = "e2e_desktop"
path = "tests/e2e_desktop.rs"
harness = false

[[test]]
name = "e2e_hotkeys"
path = "tests/e2e_hotkeys.rs"
harness = false

[[test]]
name = "e2e_media"
path = "tests/e2e_media.rs"
harness = false

[lints]
workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tempfile.workspace = true
uuid.workspace = true
jiff.workspace = true
sha2.workspace = true
base64.workspace = true
semver.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-oslog.workspace = true
objc2.workspace = true
objc2-foundation = { workspace = true, features = [
  "std",
  "NSObject",
  "NSNotification",
  "NSString",
  "NSArray",
  "NSDictionary",
  "NSAttributedString",
  "NSData",
  "NSURL",
