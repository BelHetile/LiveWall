[package]
name = "livewall"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LiveWall menu-bar wallpaper engine"

[lib]
name = "livewall"
path = "src/lib.rs"

[[bin]]
name = "LiveWall"
path = "src/main.rs"

[[test]]
name = "e2e_desktop"
path = "tests/e2e_desktop.rs"
harness = false

[lints]
workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tempfile.workspace = true
uuid.workspace = true
jiff.workspace = true
sha2.workspace = true
base64.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-oslog.workspace = true
objc2.workspace = true
objc2-foundation = { workspace = true, features = [
    "std",
    "NSObject",
    "NSNotification",
    "NSString",
    "NSArray",
    "NSDictionary",
    "NSData",
    "NSURL",
    "NSValue",
    "NSGeometry",
    "NSOperation",
    "NSTimer",
    "NSDate",
    "NSRunLoop",
    "NSError",
    "NSDistributedNotificationCenter",
    "NSProcessInfo",
    "block2",
] }
objc2-app-kit = { workspace = true, features = [
    "std",
    "NSApplication",
    "NSResponder",
    "NSRunningApplication",
    "NSWindow",
    "NSView",
    "NSScreen",
    "NSColor",
    "NSWorkspace",
    "NSGraphics",
    "objc2-quartz-core",
    "objc2-core-foundation",
] }
objc2-core-foundation = { workspace = true, features = [
    "std",
    "CFArray",
    "CFDictionary",
    "CFNumber",
    "CFString",
    "CFURL",
    "CFUUID",
    "CFData",
    "CFError",
    "CFPropertyList",
] }
objc2-core-graphics = { workspace = true, features = [
    "std",
    "CGWindow",
    "CGWindowLevel",
    "CGGeometry",
    "CGDirectDisplay",
    "CGImage",
] }
objc2-core-media = { workspace = true, features = ["std", "CMTime"] }
objc2-core-audio = { workspace = true, features = ["std", "AudioHardware", "objc2", "block2", "dispatch2"] }
objc2-quartz-core = { workspace = true, features = ["std", "CALayer", "objc2-core-foundation"] }
objc2-av-foundation = { workspace = true, features = [
    "std",
    "AVAsset",
    "AVAssetTrack",
    "AVAssetImageGenerator",
    "AVMediaFormat",
    "AVAsynchronousKeyValueLoading",
    "AVPlayer",
    "AVPlayerItem",
    "AVPlayerLayer",
    "AVPlayerLooper",
    "AVAnimation",
    "block2",
    "objc2-core-media",
    "objc2-core-foundation",
    "objc2-core-graphics",
    "objc2-quartz-core",
] }
objc2-image-io = { workspace = true, features = ["std", "CGImageSource", "CGImageDestination", "CGImageProperties", "objc2-core-graphics"] }
objc2-color-sync = { workspace = true, features = ["std", "ColorSyncDevice"] }
block2.workspace = true
dispatch2.workspace = true
libc.workspace = true
proto.workspace = true
