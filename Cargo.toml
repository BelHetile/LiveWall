[workspace]
resolver = "3"
members = ["crates/proto", "crates/ctl", "crates/app"]

[workspace.package]
version = "2.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/BelHetile/LiveWall"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
needless_return = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
tempfile = "3"
uuid = { version = "1", features = ["v4", "serde"] }
jiff = { version = "0.2", features = ["serde"] }
tokio = { version = "1.53", features = [
  "rt-multi-thread",
  "net",
  "io-util",
  "sync",
  "time",
  "signal",
  "macros",
  "process",
] }
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-oslog = "0.3"
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false }
objc2-app-kit = { version = "0.3.2", default-features = false }
objc2-core-foundation = { version = "0.3.2", default-features = false }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = [
  "CGPath",
] }
objc2-core-media = { version = "0.3.2", default-features = false }
objc2-core-video = { version = "0.3.2", default-features = false }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = [
  "CAAnimation",
  "CAShapeLayer",
  "CATransaction",
  "objc2-core-graphics",
] }
objc2-av-foundation = { version = "0.3.2", default-features = false }
objc2-image-io = { version = "0.3.2", default-features = false }
objc2-color-sync = { version = "0.3.2", default-features = false }
objc2-service-management = { version = "0.3.2", default-features = false }
objc2-video-toolbox = { version = "0.3.2", default-features = false }
objc2-local-authentication = { version = "0.3.2", default-features = false }
semver = "1"
plist = "1"
block2 = "0.6"
dispatch2 = "0.3"
libc = "0.2"
sha2 = "0.10"
base64 = "0.22"
proto = { package = "livewall-proto", path = "crates/proto" }

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
